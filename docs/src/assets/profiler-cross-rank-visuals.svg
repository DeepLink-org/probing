<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Cross-rank profiler visualization system</title>
  <desc id="desc">Six coordinated views reveal time, rank, operation, collective, call-path, and topology patterns while sharing one time and rank selection context.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; fill: #475569; }
      .head { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .body { font-family: Arial, sans-serif; font-size: 13px; fill: #334155; }
      .small { font-family: Arial, sans-serif; font-size: 11px; fill: #475569; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .axis { stroke: #64748b; stroke-width: 1.3; }
      .link { stroke: #94a3b8; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="960" fill="#f8fafc"/>
  <text class="title" x="60" y="58">Cross-Rank Views Are Different Projections of One Query Context</text>
  <text class="subtitle" x="60" y="88">Select a rank set or time window in any view; every other view recomputes against the same evidence.</text>

  <rect x="60" y="125" width="405" height="270" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text class="head" x="84" y="157">A. Rank x Time Heatmap</text>
  <text class="body" x="84" y="180">Find when and where rank behavior diverges</text>
  <g transform="translate(116 206)">
    <rect width="310" height="150" fill="#f8fafc" stroke="#cbd5e1"/>
    <g class="grid"><path d="M0 30H310M0 60H310M0 90H310M0 120H310M62 0V150M124 0V150M186 0V150M248 0V150"/></g>
    <rect x="1" y="1" width="60" height="28" fill="#dbeafe"/><rect x="63" y="1" width="60" height="28" fill="#bfdbfe"/>
    <rect x="125" y="1" width="60" height="28" fill="#93c5fd"/><rect x="187" y="1" width="60" height="28" fill="#60a5fa"/>
    <rect x="249" y="1" width="60" height="28" fill="#3b82f6"/>
    <rect x="1" y="31" width="60" height="28" fill="#dbeafe"/><rect x="63" y="31" width="60" height="28" fill="#bfdbfe"/>
    <rect x="125" y="31" width="60" height="28" fill="#fb7185"/><rect x="187" y="31" width="60" height="28" fill="#f43f5e"/>
    <rect x="249" y="31" width="60" height="28" fill="#93c5fd"/>
    <rect x="1" y="61" width="60" height="28" fill="#bfdbfe"/><rect x="63" y="61" width="60" height="28" fill="#60a5fa"/>
    <rect x="125" y="61" width="60" height="28" fill="#3b82f6"/><rect x="187" y="61" width="60" height="28" fill="#2563eb"/>
    <rect x="249" y="61" width="60" height="28" fill="#60a5fa"/>
    <rect x="1" y="91" width="60" height="28" fill="#dbeafe"/><rect x="63" y="91" width="60" height="28" fill="#93c5fd"/>
    <rect x="125" y="91" width="60" height="28" fill="#60a5fa"/><rect x="187" y="91" width="60" height="28" fill="#3b82f6"/>
    <rect x="249" y="91" width="60" height="28" fill="#2563eb"/>
    <rect x="1" y="121" width="60" height="28" fill="#e2e8f0"/><rect x="63" y="121" width="60" height="28" fill="#cbd5e1"/>
    <rect x="125" y="121" width="60" height="28" fill="#94a3b8"/><rect x="187" y="121" width="60" height="28" fill="#64748b"/>
    <rect x="249" y="121" width="60" height="28" fill="#475569"/>
  </g>

  <rect x="518" y="125" width="405" height="270" rx="16" fill="#ffffff" stroke="#06b6d4" stroke-width="2"/>
  <text class="head" x="542" y="157">B. Quantile-Band Timeline</text>
  <text class="body" x="542" y="180">Expose P50 / P95 / max separation over time</text>
  <g transform="translate(566 220)">
    <line class="axis" x1="0" y1="130" x2="310" y2="130"/>
    <line class="axis" x1="0" y1="10" x2="0" y2="130"/>
    <path d="M0 100 C45 96 70 84 105 92 S170 84 205 90 S265 74 310 82 L310 115 C270 110 245 112 205 109 S145 111 105 108 S45 113 0 114 Z" fill="#bae6fd"/>
    <path d="M0 112 C45 109 70 102 105 106 S170 101 205 104 S265 93 310 97" fill="none" stroke="#0284c7" stroke-width="3"/>
    <path d="M0 84 C45 82 72 55 105 76 S166 65 205 75 S265 33 310 58" fill="none" stroke="#f97316" stroke-width="3"/>
    <text class="small" x="250" y="48">MAX</text><text class="small" x="260" y="91">P95</text><text class="small" x="260" y="126">P50</text>
  </g>

  <rect x="976" y="125" width="404" height="270" rx="16" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
  <text class="head" x="1000" y="157">C. Collective Waterfall</text>
  <text class="body" x="1000" y="180">Separate late arrival from slow transfer</text>
  <g transform="translate(1024 214)">
    <line class="axis" x1="0" y1="160" x2="310" y2="160"/>
    <line x1="126" y1="0" x2="126" y2="160" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <g fill="#fdba74"><rect x="35" y="9" width="86" height="16"/><rect x="25" y="41" width="96" height="16"/><rect x="48" y="73" width="73" height="16"/><rect x="90" y="105" width="31" height="16"/><rect x="42" y="137" width="79" height="16"/></g>
    <g fill="#2563eb"><rect x="126" y="9" width="72" height="16"/><rect x="126" y="41" width="76" height="16"/><rect x="126" y="73" width="70" height="16"/><rect x="126" y="105" width="138" height="16"/><rect x="126" y="137" width="74" height="16"/></g>
    <text class="small" x="94" y="176">entry</text><text class="small" x="208" y="119">slow transfer</text>
  </g>

  <rect x="60" y="445" width="405" height="270" rx="16" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text class="head" x="84" y="477">D. Behavior Groups</text>
  <text class="body" x="84" y="500">Compress 10K tracks into representative patterns</text>
  <g transform="translate(94 536)">
    <circle cx="80" cy="75" r="58" fill="#dcfce7" stroke="#22c55e"/><text class="head" x="51" y="72">9,600</text><text class="small" x="43" y="92">main pattern</text>
    <circle cx="218" cy="70" r="42" fill="#ffedd5" stroke="#f97316"/><text class="head" x="196" y="68">320</text><text class="small" x="190" y="87">slow group</text>
    <circle cx="305" cy="122" r="27" fill="#ffe4e6" stroke="#f43f5e"/><text class="head" x="291" y="128">80</text>
    <path d="M145 74 H171" stroke="#94a3b8" stroke-width="2"/><path d="M256 92 L280 108" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <rect x="518" y="445" width="405" height="270" rx="16" fill="#ffffff" stroke="#c026d3" stroke-width="2"/>
  <text class="head" x="542" y="477">E. Differential Flamegraph</text>
  <text class="body" x="542" y="500">Show call paths added by the slow cohort</text>
  <g transform="translate(554 538)">
    <rect x="0" y="132" width="336" height="34" fill="#64748b"/>
    <rect x="0" y="94" width="205" height="34" fill="#f87171"/><rect x="209" y="94" width="127" height="34" fill="#60a5fa"/>
    <rect x="0" y="56" width="122" height="34" fill="#ef4444"/><rect x="126" y="56" width="79" height="34" fill="#fca5a5"/>
    <rect x="209" y="56" width="62" height="34" fill="#3b82f6"/><rect x="275" y="56" width="61" height="34" fill="#93c5fd"/>
    <rect x="0" y="18" width="72" height="34" fill="#dc2626"/><rect x="76" y="18" width="46" height="34" fill="#fb7185"/>
    <text class="small" x="10" y="153" fill="#ffffff">training_step</text>
    <text class="small" x="10" y="116">slow cohort +</text><text class="small" x="219" y="116">reference +</text>
  </g>

  <rect x="976" y="445" width="404" height="270" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text class="head" x="1000" y="477">F. Topology Projection</text>
  <text class="body" x="1000" y="500">Reveal node, PCIe, NIC, and rail concentration</text>
  <g transform="translate(1020 540)">
    <rect x="0" y="0" width="150" height="136" rx="10" fill="#f0fdfa" stroke="#5eead4"/>
    <rect x="174" y="0" width="150" height="136" rx="10" fill="#f0fdfa" stroke="#5eead4"/>
    <text class="small" x="12" y="22">node A / rail 0</text><text class="small" x="186" y="22">node B / rail 1</text>
    <g fill="#2dd4bf"><circle cx="28" cy="52" r="12"/><circle cx="66" cy="52" r="12"/><circle cx="104" cy="52" r="12"/><circle cx="28" cy="94" r="12"/><circle cx="66" cy="94" r="12"/><circle cx="104" cy="94" r="12"/></g>
    <g><circle cx="202" cy="52" r="12" fill="#2dd4bf"/><circle cx="240" cy="52" r="12" fill="#fb7185"/><circle cx="278" cy="52" r="12" fill="#f43f5e"/><circle cx="202" cy="94" r="12" fill="#2dd4bf"/><circle cx="240" cy="94" r="12" fill="#fb7185"/><circle cx="278" cy="94" r="12" fill="#f43f5e"/></g>
    <path d="M150 67 H174" stroke="#64748b" stroke-width="3"/>
  </g>

  <rect x="260" y="775" width="920" height="125" rx="18" fill="#0f172a"/>
  <text x="292" y="811" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Shared ViewContext</text>
  <text x="292" y="842" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">capture group  ·  alignment  ·  time window  ·  rank-set token  ·  subject/reference cohorts</text>
  <text x="292" y="871" font-family="Arial, sans-serif" font-size="14" fill="#93c5fd">Every click becomes a new bounded distributed query and a replayable evidence token.</text>
  <path class="link" d="M262 395 C262 740 500 738 500 765"/>
  <path class="link" d="M720 395 V765"/>
  <path class="link" d="M1178 395 C1178 740 940 738 940 765"/>
</svg>
