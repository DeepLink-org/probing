<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563EB"/></marker></defs>
  <rect width="1280" height="500" fill="#F8FAFC"/>
  <g font-family="PingFang SC, Microsoft YaHei, Arial">
    <text x="640" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#17324D">TorchProbe Step 计时边界</text>
    <text x="640" y="68" text-anchor="middle" font-size="12" fill="#64748B">先记录墙钟终点，再回收延迟事件；回收成本不计入刚结束的 Step</text>

    <line x1="94" y1="246" x2="1182" y2="246" stroke="#94A3B8" stroke-width="4" marker-end="url(#a)"/>
    <rect x="110" y="164" width="164" height="72" rx="10" fill="#17324D"/><text x="192" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">上一 Step 结束</text><text x="192" y="215" text-anchor="middle" font-size="9" fill="#CBD5E1">_mark_step_wall_start</text>
    <rect x="310" y="164" width="280" height="72" rx="10" fill="#DBEAFE" stroke="#2563EB"/><text x="450" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#174EA6">forward / backward / optimizer</text><text x="450" y="215" text-anchor="middle" font-size="9" fill="#64748B">step_duration_sec 覆盖的训练计算</text>
    <rect x="626" y="164" width="190" height="72" rx="10" fill="#F0FDFA" stroke="#0D9488"/><text x="721" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#0F766E">记录墙钟终点</text><text x="721" y="215" text-anchor="middle" font-size="9" fill="#64748B">_record_step_timing()</text>
    <rect x="852" y="164" width="190" height="72" rx="10" fill="#FFF7ED" stroke="#EA580C"/><text x="947" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">回收延迟事件</text><text x="947" y="215" text-anchor="middle" font-size="9" fill="#64748B">_drain_deferred()</text>
    <rect x="1078" y="164" width="120" height="72" rx="10" fill="#FAF5FF" stroke="#7C3AED"/><text x="1138" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#6D28D9">推进周期</text><text x="1138" y="215" text-anchor="middle" font-size="9" fill="#64748B">advance</text>

    <line x1="192" y1="266" x2="721" y2="266" stroke="#2563EB" stroke-width="8"/>
    <text x="456" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#174EA6">当前 Step 的计时窗口</text>
    <line x1="721" y1="266" x2="1138" y2="266" stroke="#EA580C" stroke-width="8"/>
    <text x="930" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#C2410C">计时窗口之外的整理工作</text>

    <rect x="110" y="340" width="1088" height="94" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="138" y="372" font-size="12" font-weight="700" fill="#17324D">固定顺序</text>
    <text x="138" y="400" font-size="12" fill="#475569">_record_step_timing()  -&gt;  _drain_deferred()  -&gt;  _advance_step_cycle_for_next()  -&gt;  _mark_step_wall_start()</text>
    <text x="138" y="423" font-size="10" fill="#C2410C">禁止在记录 timing 前 drain，否则前几步的 GPU Event 回收会污染本步墙钟。</text>
  </g>
</svg>
