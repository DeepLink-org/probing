<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker><marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <g font-family="PingFang SC, Microsoft YaHei, Arial">
    <text x="640" y="37" text-anchor="middle" font-size="22" font-weight="700" fill="#17324D">CLI、MCP 和 Web 复用 probing-skills，并保留各自入口适配</text>
    <text x="640" y="61" text-anchor="middle" font-size="12" fill="#64748B">CLI/MCP 调用 execute_skill；Web 复用 run_step 与解释函数，并增加会话取消和页面导航</text>

    <text x="124" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#17324D">入口</text>
    <rect x="40" y="120" width="168" height="92" rx="12" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="124" y="149" text-anchor="middle" font-size="13" font-weight="700" fill="#174EA6">CLI</text>
    <text x="124" y="174" text-anchor="middle" font-size="9" fill="#64748B">probing skill run</text>
    <text x="124" y="193" text-anchor="middle" font-size="9" fill="#64748B">本机或 --global</text>
    <rect x="40" y="230" width="168" height="92" rx="12" fill="#F0FDFA" stroke="#5EEAD4"/>
    <text x="124" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#0F766E">MCP</text>
    <text x="124" y="284" text-anchor="middle" font-size="9" fill="#64748B">plan_skill / run_skill</text>
    <text x="124" y="303" text-anchor="middle" font-size="9" fill="#64748B">服务端进程内执行</text>
    <rect x="40" y="340" width="168" height="92" rx="12" fill="#FAF5FF" stroke="#C4B5FD"/>
    <text x="124" y="369" text-anchor="middle" font-size="13" font-weight="700" fill="#7C3AED">Web</text>
    <text x="124" y="394" text-anchor="middle" font-size="9" fill="#64748B">Investigate / 页面推荐</text>
    <text x="124" y="413" text-anchor="middle" font-size="9" fill="#64748B">runner 编译进 WASM</text>
    <rect x="40" y="470" width="168" height="78" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="124" y="498" text-anchor="middle" font-size="12" font-weight="700" fill="#17324D">Python</text>
    <text x="124" y="522" text-anchor="middle" font-size="9" fill="#64748B">只负责发现与计划</text>
    <text x="124" y="539" text-anchor="middle" font-size="9" fill="#64748B">不执行步骤</text>

    <path d="M208 166 L282 236" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M208 276 L282 276" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M208 386 L282 316" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#p)"/>
    <path d="M208 510 L282 344" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>

    <rect x="290" y="102" width="430" height="460" rx="16" fill="#17324D"/>
    <text x="505" y="137" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">probing-skills · Rust 共享运行时</text>
    <rect x="320" y="164" width="370" height="58" rx="10" fill="#1E3A5F" stroke="#3B82F6"/>
    <text x="505" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">发现 / 加载 / 严格校验</text>
    <text x="505" y="207" text-anchor="middle" font-size="9" fill="#BFDBFE">catalog + SKILL.md + steps.yaml</text>
    <path d="M505 222 L505 244" stroke="#93C5FD" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="320" y="250" width="370" height="58" rx="10" fill="#1E3A5F" stroke="#3B82F6"/>
    <text x="505" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">路由 / 计划 / 参数绑定</text>
    <text x="505" y="293" text-anchor="middle" font-size="9" fill="#BFDBFE">根据页面、意图、表可用性选择 Skill</text>
    <path d="M505 308 L505 330" stroke="#93C5FD" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="320" y="336" width="370" height="58" rx="10" fill="#1E3A5F" stroke="#3B82F6"/>
    <text x="505" y="360" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">顺序执行步骤</text>
    <text x="505" y="379" text-anchor="middle" font-size="9" fill="#BFDBFE">共享处理 when / platform / on_empty / partial</text>
    <path d="M505 394 L505 416" stroke="#C4B5FD" stroke-width="2.5" marker-end="url(#p)"/>
    <rect x="320" y="422" width="370" height="58" rx="10" fill="#4C1D95" stroke="#8B5CF6"/>
    <text x="505" y="446" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">规则解释与摘要</text>
    <text x="505" y="465" text-anchor="middle" font-size="9" fill="#DDD6FE">outcomes -> findings -> summary / next steps</text>
    <rect x="320" y="500" width="370" height="38" rx="9" fill="#0F766E"/>
    <text x="505" y="524" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">输出：outcomes、findings、覆盖率、错误与跳过原因</text>

    <path d="M720 330 L790 330" stroke="#2563EB" stroke-width="3" marker-end="url(#a)"/>

    <rect x="798" y="102" width="444" height="460" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1020" y="137" text-anchor="middle" font-size="17" font-weight="700" fill="#17324D">SkillBackend：把环境差异收在适配器</text>
    <rect x="826" y="162" width="180" height="94" rx="10" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="916" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#174EA6">CliBackend</text>
    <text x="916" y="211" text-anchor="middle" font-size="9" fill="#64748B">经 ProbeEndpoint 调 HTTP</text>
    <text x="916" y="231" text-anchor="middle" font-size="9" fill="#64748B">local / cluster query</text>
    <rect x="1024" y="162" width="190" height="94" rx="10" fill="#F0FDFA" stroke="#5EEAD4"/>
    <text x="1119" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#0F766E">ServerBackend</text>
    <text x="1119" y="211" text-anchor="middle" font-size="9" fill="#64748B">MCP 进程内调用查询与 fan-out</text>
    <text x="1119" y="231" text-anchor="middle" font-size="9" fill="#64748B">避免 HTTP 回环</text>
    <rect x="826" y="274" width="180" height="94" rx="10" fill="#FAF5FF" stroke="#C4B5FD"/>
    <text x="916" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#7C3AED">WebBackend</text>
    <text x="916" y="323" text-anchor="middle" font-size="9" fill="#64748B">WASM 经 ApiClient 调 HTTP</text>
    <text x="916" y="343" text-anchor="middle" font-size="9" fill="#64748B">UI 步骤可以导航页面</text>
    <rect x="1024" y="274" width="190" height="94" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="1119" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#C2410C">共同接口</text>
    <text x="1119" y="323" text-anchor="middle" font-size="9" fill="#64748B">query_local · cluster_query</text>
    <text x="1119" y="343" text-anchor="middle" font-size="9" fill="#64748B">get · peer_count</text>
    <path d="M1020 368 L1020 400" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="826" y="406" width="388" height="82" rx="10" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="1020" y="432" text-anchor="middle" font-size="11" font-weight="700" fill="#174EA6">共同的数据与控制能力</text>
    <text x="1020" y="455" text-anchor="middle" font-size="9" fill="#64748B">本地查询 · 联邦查询 · 扩展 GET · 节点数量</text>
    <text x="1020" y="474" text-anchor="middle" font-size="9" fill="#64748B">返回 DataFrame 与 cluster_meta</text>
    <rect x="826" y="504" width="388" height="34" rx="8" fill="#17324D"/>
    <text x="1020" y="526" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">新增入口只实现 Backend，不复制 Skill 语义</text>

    <rect x="38" y="590" width="1204" height="88" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="62" y="620" font-size="13" font-weight="700" fill="#17324D">LLM 的位置</text>
    <text x="62" y="648" font-size="11" fill="#64748B">Web Investigate 可用 LLM 选择 Skill、填写参数和总结结果；步骤执行、查询范围、失败语义和证据保留仍由共享 runner 决定。</text>
  </g>
</svg>
