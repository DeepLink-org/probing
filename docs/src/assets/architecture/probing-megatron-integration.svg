<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#10B981"/></marker></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <g font-family="PingFang SC, Microsoft YaHei, Arial">
    <text x="640" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#17324D">Megatron 集成：把并行角色与 iteration 对齐到 Probing 的公共坐标</text>
    <text x="640" y="63" text-anchor="middle" font-size="12" fill="#64748B">集成不替代任何采集器；它只让 Torch、通信、堆栈和系统表知道“当前是哪个并行角色、哪一个训练步”</text>

    <rect x="42" y="92" width="338" height="482" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="68" y="124" font-size="15" font-weight="700" fill="#047857">import hook 发现 Megatron</text>
    <rect x="68" y="151" width="286" height="80" rx="11" fill="#FFFFFF" stroke="#6EE7B7"/>
    <text x="88" y="180" font-size="12" font-weight="700" fill="#17324D">是否是 Megatron 作业</text>
    <text x="88" y="204" font-size="10" fill="#64748B">检测已导入模块或 TP / PP / DP 等环境变量</text>
    <text x="88" y="222" font-size="9" fill="#64748B">PROBING_MEGATRON=auto，可显式开关</text>
    <path d="M211 231 L211 259" stroke="#10B981" stroke-width="2" marker-end="url(#a)"/>
    <rect x="68" y="267" width="286" height="88" rx="11" fill="#FFFFFF" stroke="#6EE7B7"/>
    <text x="88" y="296" font-size="12" font-weight="700" fill="#17324D">megatron.core.parallel_state</text>
    <text x="88" y="320" font-size="10" fill="#64748B">模块加载后调用 init_parallel_state</text>
    <text x="88" y="340" font-size="10" fill="#64748B">并包装 initialize_model_parallel 的返回点</text>
    <path d="M211 355 L211 383" stroke="#10B981" stroke-width="2" marker-end="url(#a)"/>
    <rect x="68" y="391" width="286" height="88" rx="11" fill="#FFFFFF" stroke="#6EE7B7"/>
    <text x="88" y="420" font-size="12" font-weight="700" fill="#17324D">megatron.training.training</text>
    <text x="88" y="444" font-size="10" fill="#64748B">模块加载后调用 init_training</text>
    <text x="88" y="464" font-size="10" fill="#64748B">按需包装 train_step；所有 hook 均 best-effort</text>
    <rect x="68" y="505" width="286" height="42" rx="9" fill="#D1FAE5"/>
    <text x="211" y="531" text-anchor="middle" font-size="9" font-weight="700" fill="#047857">Megatron 不存在或 API 变化时静默降级</text>

    <path d="M380 330 L420 330" stroke="#10B981" stroke-width="2" marker-end="url(#a)"/>
    <rect x="428" y="92" width="382" height="482" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="454" y="124" font-size="15" font-weight="700" fill="#174EA6">读取 Megatron 状态，写入两个公共接口</text>
    <rect x="454" y="151" width="330" height="154" rx="11" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="474" y="181" font-size="12" font-weight="700" fill="#174EA6">probing.set_role(...)</text>
    <text x="474" y="207" font-size="10" fill="#475569">tp = tensor model parallel rank</text>
    <text x="474" y="229" font-size="10" fill="#475569">pp = pipeline model parallel rank</text>
    <text x="474" y="251" font-size="10" fill="#475569">dp / ep / cp = data / expert / context rank</text>
    <text x="474" y="279" font-size="10" fill="#64748B">规范化为 role 字符串，并更新节点注册信息</text>
    <rect x="454" y="329" width="330" height="178" rx="11" fill="#FAF5FF" stroke="#7C3AED"/>
    <text x="474" y="359" font-size="12" font-weight="700" fill="#7C3AED">probing.step(...)</text>
    <text x="474" y="385" font-size="10" fill="#475569">iteration 视为 optimizer local_step</text>
    <text x="474" y="407" font-size="10" fill="#475569">读取 get_num_microbatches；缺失时由 batch 参数估算</text>
    <text x="474" y="429" font-size="10" fill="#475569">micro_step = iteration x micro_batches</text>
    <text x="474" y="457" font-size="10" fill="#64748B">train_step 进入前强制同步一次，避免动态 batch 失配</text>
    <text x="474" y="479" font-size="9" fill="#64748B">PROBING_MEGATRON_STEP_SYNC=auto，可单独关闭</text>
    <rect x="454" y="526" width="330" height="21" rx="6" fill="#17324D"/>

    <path d="M810 330 L850 330" stroke="#10B981" stroke-width="2" marker-end="url(#a)"/>
    <rect x="858" y="92" width="380" height="482" rx="14" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
    <text x="884" y="124" font-size="15" font-weight="700" fill="#0F766E">适配器更新公共 step / role 状态</text>
    <g font-size="10">
      <rect x="884" y="151" width="328" height="70" rx="10" fill="#F0FDFA" stroke="#0D9488"/>
      <text x="904" y="179" font-weight="700" fill="#0F766E">TorchProbe</text><text x="904" y="202" fill="#64748B">module / phase / duration + step + role</text>
      <rect x="884" y="239" width="328" height="70" rx="10" fill="#FFF7ED" stroke="#F97316"/>
      <text x="904" y="267" font-weight="700" fill="#C2410C">Collective / NCCL / HCCL</text><text x="904" y="290" fill="#64748B">用 rank、时间窗与 step 字段在 SQL 中关联</text>
      <rect x="884" y="327" width="328" height="70" rx="10" fill="#FAF5FF" stroke="#7C3AED"/>
      <text x="904" y="355" font-weight="700" fill="#7C3AED">堆栈与分布式火焰图</text><text x="904" y="378" fill="#64748B">frame 节点显示贡献 rank 与并行角色</text>
      <rect x="884" y="415" width="328" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
      <text x="904" y="443" font-weight="700" fill="#174EA6">Torch Profiler / 系统指标</text><text x="904" y="466" fill="#64748B">capture、kernel、GPU/CPU 快照使用相同 step</text>
    </g>
    <rect x="884" y="506" width="328" height="41" rx="9" fill="#ECFDF5"/>
    <text x="1048" y="531" text-anchor="middle" font-size="9" font-weight="700" fill="#047857">查询可按 tp / pp / dp / ep / cp 分组比较</text>

    <rect x="42" y="602" width="1196" height="80" rx="12" fill="#17324D"/>
    <text x="68" y="632" font-size="11" font-weight="700" fill="#FFFFFF">为什么只做坐标集成</text>
    <text x="68" y="657" font-size="10" fill="#CBD5E1">Megatron 版本变化集中在少量 getter 和 hook 入口；采集器仍只依赖 probing.step / set_role 公共接口，避免把 Megatron 内部类型扩散到 Torch、通信和查询模块。</text>
  </g>
</svg>
