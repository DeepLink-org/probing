<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Distributed timeline query execution</title>
  <desc id="desc">An explicit three-stage plan pushes filtering and aggregation to ranks, merges partial state by node, then calculates global visualization data and a query receipt.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; fill: #475569; }
      .head { font-family: Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .body { font-family: Arial, sans-serif; font-size: 14px; fill: #334155; }
      .small { font-family: Arial, sans-serif; font-size: 12px; fill: #475569; }
      .code { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #334155; }
      .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .cancel { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#f8fafc"/>
  <text class="title" x="60" y="58">Explicit Execution Plan for Global Timeline Semantics</text>
  <text class="subtitle" x="60" y="88">No implicit “run locally, then concatenate” fallback for aggregate, join, or alignment.</text>

  <rect x="60" y="130" width="305" height="580" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text class="head" x="86" y="166">RankPlan</text>
  <text class="small" x="86" y="189">runs on every target trace partition</text>
  <rect x="86" y="218" width="253" height="74" rx="10" fill="#dcfce7"/>
  <text class="body" x="104" y="247">1. Predicate pushdown</text>
  <text class="small" x="104" y="271">capture / step / time / track / kind</text>
  <rect x="86" y="312" width="253" height="74" rx="10" fill="#dcfce7"/>
  <text class="body" x="104" y="341">2. Local interval algebra</text>
  <text class="small" x="104" y="365">union / overlap / exposed time</text>
  <rect x="86" y="406" width="253" height="74" rx="10" fill="#dcfce7"/>
  <text class="body" x="104" y="435">3. Build partial state</text>
  <text class="small" x="104" y="459">tiles / sketches / top-k / stacks</text>
  <rect x="86" y="500" width="253" height="74" rx="10" fill="#dcfce7"/>
  <text class="body" x="104" y="529">4. Exact data gate</text>
  <text class="small" x="104" y="553">only bounded ranks and time windows</text>
  <rect x="86" y="608" width="253" height="68" rx="10" fill="#ffffff" stroke="#86efac"/>
  <text class="code" x="104" y="635">rows_scanned, coverage</text>
  <text class="code" x="104" y="656">partial_state, error</text>

  <rect x="470" y="130" width="400" height="580" rx="18" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text class="head" x="496" y="166">NodePlan</text>
  <text class="small" x="496" y="189">one local coordinator per machine</text>
  <rect x="496" y="218" width="348" height="90" rx="10" fill="#cffafe"/>
  <text class="body" x="516" y="247">Merge local-rank state</text>
  <text class="small" x="516" y="271">quantile sketch + top-k + bitmap union</text>
  <text class="small" x="516" y="290">interval occupancy by node / role</text>
  <rect x="496" y="331" width="348" height="90" rx="10" fill="#cffafe"/>
  <text class="body" x="516" y="360">Join node-local context</text>
  <text class="small" x="516" y="384">GPU / NIC / PCIe / NUMA counters</text>
  <text class="small" x="516" y="403">topology labels and clock quality</text>
  <rect x="496" y="444" width="348" height="90" rx="10" fill="#cffafe"/>
  <text class="body" x="516" y="473">Bound and compress output</text>
  <text class="small" x="516" y="497">rank bitmap token + bounded candidates</text>
  <text class="small" x="516" y="516">Arrow RecordBatch partial stream</text>
  <rect x="496" y="608" width="348" height="68" rx="10" fill="#ffffff" stroke="#67e8f9"/>
  <text class="code" x="516" y="635">ranks_seen, node_state</text>
  <text class="code" x="516" y="656">bytes_scanned, partial</text>

  <rect x="975" y="130" width="405" height="580" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text class="head" x="1001" y="166">CoordinatorPlan</text>
  <text class="small" x="1001" y="189">global semantics and result contract</text>
  <rect x="1001" y="218" width="353" height="90" rx="10" fill="#dbeafe"/>
  <text class="body" x="1021" y="247">Merge global state</text>
  <text class="small" x="1021" y="271">P50 / P95 / P99, global top-k</text>
  <text class="small" x="1021" y="290">rank coverage and membership epoch</text>
  <rect x="1001" y="331" width="353" height="90" rx="10" fill="#dbeafe"/>
  <text class="body" x="1021" y="360">Compute global structure</text>
  <text class="small" x="1021" y="384">behavior groups, outliers, alignment</text>
  <text class="small" x="1021" y="403">cohort comparison and evidence tokens</text>
  <rect x="1001" y="444" width="353" height="90" rx="10" fill="#dbeafe"/>
  <text class="body" x="1021" y="473">Render-ready outputs</text>
  <text class="small" x="1021" y="497">timeline tiles / flamegraph tree</text>
  <text class="small" x="1021" y="516">waterfall / heatmap / findings</text>
  <rect x="1001" y="608" width="353" height="68" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text class="code" x="1021" y="635">exact, error_bound, failed_parts</text>
  <text class="code" x="1021" y="656">elapsed_ms, query_id</text>

  <path class="line" d="M365 420 H460"/>
  <text class="small" x="383" y="404">rank states</text>
  <path class="line" d="M870 420 H965"/>
  <text class="small" x="886" y="404">node states</text>

  <rect x="60" y="758" width="1320" height="95" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="head" x="84" y="791">Runtime contract</text>
  <text class="body" x="84" y="820">Streaming first result</text>
  <text class="body" x="292" y="820">Backpressure</text>
  <text class="body" x="450" y="820">Viewport cancellation</text>
  <text class="body" x="684" y="820">Deadline and budget</text>
  <text class="body" x="898" y="820">Partial-result policy</text>
  <text class="body" x="1120" y="820">Replayable receipt</text>

  <path class="cancel" d="M1178 742 C1178 722 670 733 670 716"/>
  <text class="small" x="803" y="740" fill="#b91c1c">cancel propagates to unfinished partitions</text>
</svg>
